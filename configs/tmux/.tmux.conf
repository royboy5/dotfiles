###########
# GENERAL #
###########

# remapping prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# read config file
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced!'

# utf8
setw -q -g utf8 on

# Beep beep
set -g visual-bell on

# Allow copy to clipboard
set -g set-clipboard on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Note: escape-time, history-limit, focus-events, and xterm-keys 
# are now handled by the 'tmux-sensible' plugin.

###########
# DISPLAY #
###########

# screen color to 256
set -g default-terminal "screen-256color"

# tell Tmux that outside terminal supports true color
set -ga terminal-overrides ",xterm-256color*:Tc"

# don't rename windows automatically
set-option -g allow-rename off

# renumber windows when a window is closed
set -g renumber-windows on

# pane indicators display time
set -g display-panes-time 800

# redraw status line
set -g status-interval 10

# activity
set -g monitor-activity on
set -g visual-activity off

# Clear screen and history
bind C-l send-keys C-l \; run 'sleep 0.1' \; clear-history

# split panes in current directory using | and -
bind | split-window -h -c '#{pane_current_path}' \;
bind - split-window -v -c '#{pane_current_path}' \;
bind -r M-m select-layout main-vertical
bind -r M-M select-layout main-horizontal

##############
# NAVIGATION #
##############

# pane navigation
bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# switch panes using Alt-arrow without prefix
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# enable mouse mode (tmux 2.1 and above)
set -g mouse on

###########
# BUFFERS #
###########

bind b list-buffers  # list paste buffers
bind p paste-buffer  # paste from the top paste buffer
bind P choose-buffer # choose which buffer to paste from

########
# Yazi #
########

set -g allow-passthrough on

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

###########
# PLUGINS #
###########

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'fabioluciano/tmux-tokyo-night'

# Theme settings
set -g @theme_variation 'storm'
set -g @theme_transparent_status_bar 'true'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'